# Google SSO credentials — OPTIONAL. If this Secret is not applied,
# the app still runs: it just hides the sign-in button.
#
# Same copy-and-edit pattern as 01-postgres-secret.example.yaml:
#   cp 04b-google-auth-secret.example.yaml 04b-google-auth-secret.yaml
#   edit the real file, apply it, NEVER commit it
# (The .gitignore keeps *-secret.yaml out of git, but keeps *.example.yaml.)
#
# The redirect URI you registered in Google Cloud Console must be:
#   https://<your-ingress-host>/auth/google/callback
apiVersion: v1
kind: Secret
metadata:
  name: url-shortener-google-auth
  namespace: url-shortener
type: Opaque
stringData:
  GOOGLE_CLIENT_ID: "paste-client-id-here.apps.googleusercontent.com"
  GOOGLE_CLIENT_SECRET: "paste-client-secret-here"
  # Signs session cookies. Generate with: openssl rand -hex 32
  SESSION_SECRET: "paste-a-long-random-string-here"
