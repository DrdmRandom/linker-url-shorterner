# ⚠️ EXAMPLE FILE — not applied as-is.
#
#   1. Copy it:          cp 01-postgres-secret.example.yaml 01-postgres-secret.yaml
#   2. Change the password to something random
#   3. Apply the copy:   kubectl apply -f k8s/01-postgres-secret.yaml
#
# .gitignore blocks *-secret.yaml from ever being committed, so the
# real password never reaches git. (At work, tools like Vault/external
# secrets handle this; for learning, this is the honest manual way.)
#
# stringData lets you write plain text; Kubernetes stores it base64'd.
apiVersion: v1
kind: Secret
metadata:
  name: url-shortener-postgres
  namespace: url-shortener
type: Opaque
stringData:
  POSTGRES_USER: shortener
  POSTGRES_PASSWORD: change-me-to-something-random
  POSTGRES_DB: shortener
