name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

env:
  REGISTRY: 192.168.100.42:3001
  IMAGE: linker
  GO_VERSION: '1.24'
  NODE_VERSION: '22'

jobs:
  # ------------------------------------------------------------------
  # Lint, test, build — runs on every push and PR
  # ------------------------------------------------------------------
  ci:
    # Change labels to match your runner, e.g. [self-hosted, linux, arm64]
    # or your specific runner pool label like [self-hosted, ci-pool]
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4

      # ---- Go lint ----
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum
      - name: Go vet
        run: go vet ./...
        working-directory: backend

      # ---- Go test ----
      - name: Go test
        run: go test ./... -v -count=1
        working-directory: backend

      # ---- Frontend lint + build ----
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend install
        run: npm ci
        working-directory: frontend
      - name: Frontend lint
        run: npm run lint
        working-directory: frontend
      - name: Frontend build
        run: npm run build
        working-directory: frontend

      # ---- Go build (verify it compiles with the embedded frontend) ----
      - name: Copy frontend dist to backend
        run: cp -r frontend/dist backend/web/dist
      - name: Go build
        run: go build -o /dev/null ./...
        working-directory: backend

  # ------------------------------------------------------------------
  # Buildx + push — only on main after ci passes
  # ------------------------------------------------------------------
  publish:
    if: github.ref == 'refs/heads/main'
    needs: [ci]
    # Same runner labels as ci — change if publish needs different hardware
    runs-on: [self-hosted, linux, x64]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # ---- Build frontend ----
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        run: npm ci && npm run build
        working-directory: frontend

      # ---- Inject frontend into backend ----
      - name: Copy frontend dist
        run: cp -r frontend/dist backend/web/dist

      # ---- Docker buildx + push ----
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # No login needed — local registry is on the same host without auth.
      # If your registry needs auth, add a docker/login-action step here.

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max