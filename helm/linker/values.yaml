# =====================================================================
# Linker — URL shortener + QR code generator
# =====================================================================

# Number of replicas when autoscaling is disabled.
replicaCount: 1

image:
  repository: 192.168.100.42:3001/linker
  tag: "latest"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: linker.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# --------------------------------------------------
# Probe configuration
# --------------------------------------------------
probes:
  liveness:
    initialDelaySeconds: 5
    periodSeconds: 15
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 2

resources:
  requests:
    cpu: "100m"
    memory: "64Mi"
  limits:
    cpu: "500m"
    memory: "128Mi"

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}

# --------------------------------------------------
# App configuration
# --------------------------------------------------

# Public base URL for OAuth redirects and short links.
# Change this to your domain or IP once you know how you'll access it.
publicBaseUrl: "http://192.168.100.42:8080"

# Per-user link quota.
maxLinksPerUser: 15

# Session signing key — generated with openssl rand -base64 32
sessionSecret: "e7j25a4jg2mJYdVYQFRBs8xoVTJ3iZ9CgrBkKhILhs0="

# PostgreSQL connection — Docker Postgres on the host
postgres:
  host: "192.168.100.42"
  port: 3004
  database: "linker-db"
  user: "linker"
  password: "M9d6r3d12"

# Google SSO
google:
  enabled: true
  clientId: ""   # TODO: fill in your Google OAuth client ID
  clientSecret: ""   # TODO: fill in your Google OAuth client secret