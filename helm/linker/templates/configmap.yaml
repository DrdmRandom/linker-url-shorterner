apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "linker.fullname" . }}-config
  labels:
    {{- include "linker.labels" . | nindent 4 }}
data:
  POSTGRES_HOST: {{ .Values.postgres.host | quote }}
  POSTGRES_PORT: {{ .Values.postgres.port | toString | quote }}
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
  POSTGRES_USER: {{ .Values.postgres.user | quote }}
  PUBLIC_BASE_URL: {{ .Values.publicBaseUrl | quote }}
  MAX_LINKS_PER_USER: {{ .Values.maxLinksPerUser | toString | quote }}
  PORT: {{ .Values.service.targetPort | toString | quote }}